# Conda environment for the mangrove remote sensing bibliometric pipeline.
#
# This file is a convenience reconstruction for machines where pip-only
# installation of the geospatial stack is awkward. It is NOT bit-exact:
#   * bit-exact reproduction  -> use pixi.toml + pixi.lock (kept in this repo)
#   * pip-only reproduction   -> use requirements.txt (versions actually used)
#
# MKL is pinned <2025 because numpy 1.26.4 is built against mkl_rt.2.dll;
# MKL 2026 ships only mkl_rt.3.dll and np.dot() then fails to delay-load.
#
#   conda env create -f environment.yml
#   conda activate mangrove-rs-biblio
#   python -m pip install https://s3-us-west-2.amazonaws.com/ai2-s2-scispacy/releases/v0.5.4/en_core_sci_sm-0.5.4.tar.gz

name: mangrove-rs-biblio
channels:
  - conda-forge
dependencies:
  - python=3.12.13
  # --- core ---
  - numpy=1.26.4
  - pandas=3.0.3
  - scipy=1.17.1
  - scikit-learn=1.9.0
  - joblib=1.5.3
  - mkl=2024.2.2
  # --- visualization ---
  - matplotlib=3.11.0
  - seaborn=0.13.2
  - plotly=6.9.0
  - pillow=12.3.0
  # --- geospatial ---
  - geopandas=1.1.4
  - shapely=2.1.2
  - pyproj=3.7.2
  - pyogrio=0.13.0
  # --- io / utilities ---
  - pyarrow=23.0.0
  - openpyxl=3.1.5
  - pyyaml=6.0.3
  - tqdm=4.68.4
  - networkx=3.6.1
  - click=8.4.2
  # --- deep learning / nlp ---
  - pytorch=2.8.0
  - spacy=3.7.5
  - gensim=4.4.0
  - nltk=3.10.0
  - numba=0.66.0
  - pip
  - pip:
      - bertopic==0.17.4
      - sentence-transformers==5.6.0
      - transformers==4.53.2
      - huggingface-hub==0.36.2
      - safetensors==0.8.0
      - tokenizers==0.21.4
      - umap-learn==0.5.12
      - hdbscan==0.8.44
      - keybert==0.9.0
      - keyphrase-vectorizers==0.0.13
      - scispacy==0.6.2
      # optional: LLM topic labelling (Appendix A) / static Plotly export
      # - openai==2.48.0
      # - kaleido==1.3.0
